schema_version: 1

context:
  version: "0.11.5"
  python_min: "3.11"

package:
  name: vmex
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/v/vmex/vmex-${{ version }}.tar.gz
  sha256: 65188e9c5e6ed23bf4b1c9cd4e9965cd85479045ccfddf07dea588a4e46d0970

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - vmex = vmex.core.cli:main
      - vmec = vmex.core.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77
    - pip
    - packaging
  run:
    - python >=${{ python_min }}
    - numpy
    - jax >=0.9.2
    - jaxlib >=0.9.2
    - scipy >=1.16
    - netcdf4
    - h5py
    - matplotlib-base
    - booz-xform-jax >=0.4.1
    - solvax >=0.27.0
    - packaging
    - filelock

tests:
  - python:
      imports:
        - vmex
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - vmex --help
      - vmec --help
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  summary: JAX implementation of VMEC2000 with differentiable fixed-boundary and branch-local free-boundary research paths
  license: MIT
  license_file: LICENSE
  homepage: https://vmex.readthedocs.io/
  repository: https://github.com/uwplasma/vmex
  documentation: https://vmex.readthedocs.io/

extra:
  recipe-maintainers:
    - rogeriojorge
    - matthewfeickert
    - RKHashmani
