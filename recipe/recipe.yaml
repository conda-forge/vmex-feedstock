schema_version: 1

context:
  version: "0.8.1"
  python_min: "3.10"

package:
  name: vmex
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/v/vmex/vmex-${{ version }}.tar.gz
  sha256: 847664b168409415dc39453b97b6b3e1e8c615815085e0d083ae92cbf48216c7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - vmex = vmex.core.cli:main
      - vmec = vmex.core.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77
    - pip
    - packaging
  run:
    - python >=${{ python_min }}
    - numpy
    - jax
    - jaxlib
    - scipy >=1.15.0
    - netcdf4
    - matplotlib-base
    - booz-xform-jax >=0.1.1
    - solvax >=0.20.0
    - packaging
    - filelock
    # python < 3.11
    - tomli

tests:
  - python:
      imports:
        - vmex
        - vmec_jax
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - vmex --help
      - vmec --help
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  summary: JAX implementation of VMEC2000 with differentiable fixed-boundary and branch-local free-boundary research paths
  license: MIT
  license_file: LICENSE
  homepage: https://vmex.readthedocs.io/
  repository: https://github.com/uwplasma/vmex
  documentation: https://vmex.readthedocs.io/

extra:
  recipe-maintainers:
    - rogeriojorge
    - matthewfeickert
    - RKHashmani
